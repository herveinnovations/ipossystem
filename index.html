<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#113e32"/><meta name="description" content="iPOS. Run your store with confidence."/><link rel="icon" type="image/png" href="/ipos-logo.png?v=63d57fe26bca"/><link rel="apple-touch-icon" href="/apple-touch-icon.png"/><link rel="manifest" href="/manifest.webmanifest"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="iPOS"/><script>try{var c=localStorage.getItem('ipos.theme');if(c==='dark'||(c==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script><title>iPOS - Retail Workspace</title><style>#ipos-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#113e32;transition:opacity .7s ease,visibility .7s}#ipos-splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 14px 40px #00000040;animation:ipos-pop 1.3s cubic-bezier(.2,.9,.3,1.25) both}#ipos-splash span{color:#fff;font:750 32px/1 "Aptos","Trebuchet MS","Segoe UI",sans-serif;letter-spacing:-1px;animation:ipos-rise .9s .75s ease-out both}#ipos-splash.hide{opacity:0;visibility:hidden}@keyframes ipos-pop{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.14);opacity:1}75%{transform:scale(.95)}90%{transform:scale(1.02)}100%{transform:scale(1)}}@keyframes ipos-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){#ipos-splash img,#ipos-splash span{animation:none}}</style></head><body><div id="ipos-splash" aria-hidden="true"><img src="/splash-logo.png" alt="" width="96" height="96"/><span>iPOS</span></div><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
