<!-- Supabase → Authentication → Emails → "Change email address".
     Subject: Confirm your new email for iPOS -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5ef;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #dce5db;border-radius:14px;">
      <tr><td style="padding:32px 32px 8px;">
        <img src="https://ipossystem.vercel.app/icon-192.png" width="40" height="40" alt="iPOS" style="border-radius:10px;display:block;">
      </td></tr>
      <tr><td style="padding:16px 32px 0;color:#26352f;">
        <h1 style="margin:0 0 10px;font-size:24px;line-height:1.25;">Confirm your new email</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#55675d;">Tap the button to change your iPOS sign-in email from <strong style="color:#26352f;">{{ .Email }}</strong> to <strong style="color:#26352f;">{{ .NewEmail }}</strong>.</p>
      </td></tr>
      <tr><td style="padding:0 32px 8px;">
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background:#24694f;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:8px;">Confirm new email</a>
      </td></tr>
      <tr><td style="padding:20px 32px 30px;font-size:13px;line-height:1.6;color:#7b8982;">
        Didn't ask to change your email? Don't tap the button, and change your password straight away.
      </td></tr>
    </table>
    <p style="margin:16px 0 0;font-size:12px;color:#93a197;">iPOS · Run your store with confidence</p>
  </td></tr>
</table>
